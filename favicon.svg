<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#1b5e8a"/>
      <stop offset="60%" style="stop-color:#0d3b5c"/>
      <stop offset="100%" style="stop-color:#052038"/>
    </radialGradient>
    <linearGradient id="otterBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8d6e63"/>
      <stop offset="100%" style="stop-color:#6d4c41"/>
    </linearGradient>
    <linearGradient id="otterBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d7ccc8"/>
      <stop offset="100%" style="stop-color:#bcaaa4"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGrad)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Otter head -->
  <g filter="url(#shadow)">
    <!-- Head base -->
    <ellipse cx="128" cy="135" rx="55" ry="50" fill="url(#otterBody)"/>
    
    <!-- Ears -->
    <ellipse cx="88" cy="92" rx="18" ry="14" fill="#6d4c41"/>
    <ellipse cx="88" cy="92" rx="10" ry="8" fill="#a1887f"/>
    <ellipse cx="168" cy="92" rx="18" ry="14" fill="#6d4c41"/>
    <ellipse cx="168" cy="92" rx="10" ry="8" fill="#a1887f"/>

    <!-- Face / cheeks -->
    <ellipse cx="108" cy="140" rx="30" ry="28" fill="#8d6e63"/>
    <ellipse cx="148" cy="140" rx="30" ry="28" fill="#8d6e63"/>

    <!-- Light muzzle area -->
    <ellipse cx="128" cy="155" rx="35" ry="28" fill="url(#otterBelly)"/>

    <!-- Nose -->
    <ellipse cx="128" cy="148" rx="10" ry="7" fill="#3e2723"/>
    <ellipse cx="128" cy="146" rx="5" ry="3" fill="#5d4037" opacity="0.5"/>

    <!-- Eyes -->
    <ellipse cx="110" cy="128" rx="7" ry="8" fill="#1a1a1a"/>
    <ellipse cx="146" cy="128" rx="7" ry="8" fill="#1a1a1a"/>
    <!-- Eye shine -->
    <circle cx="113" cy="125" r="2.5" fill="white" opacity="0.9"/>
    <circle cx="149" cy="125" r="2.5" fill="white" opacity="0.9"/>

    <!-- Whiskers -->
    <g stroke="#bcaaa4" stroke-width="0.8" opacity="0.6">
      <line x1="80" y1="145" x2="100" y2="148"/>
      <line x1="78" y1="152" x2="100" y2="153"/>
      <line x1="156" y1="148" x2="176" y2="145"/>
      <line x1="156" y1="153" x2="178" y2="152"/>
    </g>

    <!-- Mouth -->
    <path d="M 118 158 Q 128 165 138 158" fill="none" stroke="#5d4037" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Small data/binary accents -->
  <g opacity="0.15" font-family="monospace" font-size="10" fill="white">
    <text x="45" y="50">01</text>
    <text x="190" y="55">10</text>
    <text x="48" y="220">11</text>
    <text x="195" y="215">00</text>
  </g>

  <!-- Subtle database dot pattern ring -->
  <g opacity="0.08">
    <circle cx="128" cy="20" r="3" fill="white"/>
    <circle cx="128" cy="236" r="3" fill="white"/>
    <circle cx="20" cy="128" r="3" fill="white"/>
    <circle cx="236" cy="128" r="3" fill="white"/>
    <circle cx="52" cy="52" r="2" fill="white"/>
    <circle cx="204" cy="52" r="2" fill="white"/>
    <circle cx="52" cy="204" r="2" fill="white"/>
    <circle cx="204" cy="204" r="2" fill="white"/>
  </g>
</svg>
